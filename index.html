<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Algorithm Practice — 20-Hour Plan</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="min-h-screen bg-base-200">
    <div class="navbar bg-base-300/60 sticky top-0 z-10 border-b border-base-300 backdrop-blur">
      <div class="mx-auto flex w-full max-w-4xl items-center gap-3 px-4">
        <span class="text-2xl">🧠</span>
        <div class="flex flex-col leading-tight">
          <span class="font-semibold">Algorithm Practice</span>
          <span class="text-xs text-base-content/60">
            The Frontend Developer’s 20-Hour Plan
          </span>
        </div>
      </div>
    </div>

    <main class="mx-auto max-w-4xl px-4 py-8 sm:py-12">
      <article
        id="plan"
        class="prose prose-lg mx-auto max-w-none prose-headings:scroll-mt-20 prose-headings:font-semibold prose-h1:text-3xl prose-h1:mb-2 prose-h2:mt-12 prose-h2:border-b prose-h2:border-base-300 prose-h2:pb-1 prose-h2:text-2xl prose-h3:text-xl prose-strong:text-primary prose-code:before:hidden prose-code:after:hidden prose-code:rounded prose-code:bg-base-300 prose-code:px-1.5 prose-code:py-0.5 prose-code:text-primary-content prose-a:text-primary"
      >
        <!-- marked output is injected here -->
      </article>
    </main>

    <footer class="footer footer-center p-6 text-xs text-base-content/50">
      Built with Vite + Tailwind + DaisyUI · <code>plan.md</code> rendered live
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
